name: deploy-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n update.sh
          bash -n txboard.sh
          for f in lib/*.sh; do bash -n "$f"; done

      - name: Check installer and manager regressions
        run: |
          grep -Fq 'docker compose run -T --rm --no-deps --entrypoint sh backup -lc' install.sh
          grep -Fq "external database host '\$DB_HOST' resolves inside the TXBoard container" install.sh
          grep -Fq 'public host cannot be $PUBLIC_HOST' install.sh
          grep -Fq 'cannot connect to external MySQL at $DB_HOST:$DB_PORT/$DB_DATABASE' install.sh
          grep -Fq 'docker compose run -T --rm -e BACKUP_INTERVAL=0 backup' update.sh
          grep -Fq 'compose run -T --rm -e BACKUP_INTERVAL=0 backup' lib/backup.sh
          grep -Fq 'compose run -T --rm --no-deps --entrypoint sh backup -lc' lib/diagnose.sh
          bash txboard.sh help | grep -q 'logs \[service\]'
          bash txboard.sh help | grep -q 'config-show'
          bash txboard.sh help | grep -q 'backups'

      - name: Render deployment
        env:
          TXBOARD_INSTALL_DIR: /tmp/txboard-deploy-ci
          TXBOARD_ADMIN_EMAIL: ci@example.com
          TXBOARD_MODE: http
          TXBOARD_PUBLIC_HOST: 127.0.0.1
          TXBOARD_HTTP_PORT: 18080
          TXBOARD_IMAGE_TAG: latest
        run: |
          sudo -E bash install.sh --yes --render-only
          test -f /tmp/txboard-deploy-ci/compose.yaml
          test -f /tmp/txboard-deploy-ci/.env
          test -f /tmp/txboard-deploy-ci/api.env
          sudo docker compose -f /tmp/txboard-deploy-ci/compose.yaml \
            --env-file /tmp/txboard-deploy-ci/.env config >/dev/null

      - name: Require image-only Compose
        run: |
          ! sudo grep -Eq '^[[:space:]]*build:' /tmp/txboard-deploy-ci/compose.yaml
          sudo grep -q 'ghcr.io/paimoncai/txboard:latest' /tmp/txboard-deploy-ci/.env
          sudo grep -q '^TXBOARD_MODE=http$' /tmp/txboard-deploy-ci/.env
          test "$(sudo stat -c '%a' /tmp/txboard-deploy-ci/.env)" = "600"
          test "$(sudo stat -c '%a' /tmp/txboard-deploy-ci/api.env)" = "600"

      - name: Render external database deployment
        env:
          TXBOARD_INSTALL_DIR: /tmp/txboard-deploy-external-ci
          TXBOARD_ADMIN_EMAIL: ci@example.com
          TXBOARD_MODE: http
          TXBOARD_PUBLIC_HOST: 127.0.0.1
          TXBOARD_HTTP_PORT: 18082
          TXBOARD_IMAGE_TAG: latest
          TXBOARD_DB_MODE: external
          TXBOARD_DB_HOST: mysql.example.internal
          TXBOARD_DB_PORT: 3307
          TXBOARD_DB_DATABASE: txboard_ci
          TXBOARD_DB_USERNAME: txboard_ci
          TXBOARD_DB_PASSWORD: ci-secret
        run: |
          sudo -E bash install.sh --yes --render-only
          cd /tmp/txboard-deploy-external-ci
          sudo docker compose --env-file .env config >/dev/null
          ! sudo docker compose --env-file .env config --services | grep -qx database
          sudo grep -q '^TXBOARD_DB_MODE=external$' .env
          sudo grep -q '^TXBOARD_DB_HOST=mysql.example.internal$' .env
          sudo grep -q '^TXBOARD_DB_PORT=3307$' .env
          sudo grep -q '^DB_HOST=mysql.example.internal$' api.env
          sudo grep -q '^DB_PORT=3307$' api.env
          sudo grep -q 'host.docker.internal:host-gateway' compose.yaml
          sudo rm -rf /tmp/txboard-deploy-external-ci

      - name: Reject stale managed MySQL volume
        env:
          TXBOARD_INSTALL_DIR: /tmp/txboard-stale-volume-ci
          TXBOARD_ADMIN_EMAIL: ci@example.com
          TXBOARD_MODE: http
          TXBOARD_PUBLIC_HOST: 127.0.0.1
          TXBOARD_HTTP_PORT: 18083
          TXBOARD_IMAGE_TAG: latest
          TXBOARD_DB_MODE: local
        run: |
          sudo docker volume create txboard_database-data >/dev/null
          trap 'sudo docker volume rm txboard_database-data >/dev/null 2>&1 || true; sudo rm -rf /tmp/txboard-stale-volume-ci' EXIT

          set +e
          output="$(sudo -E bash install.sh --yes 2>&1)"
          status=$?
          set -e

          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q 'existing managed MySQL volume txboard_database-data detected'
          test ! -e /tmp/txboard-stale-volume-ci/.env

      - name: Check public image manifest
        run: docker manifest inspect ghcr.io/paimoncai/txboard:latest >/dev/null

  smoke-install:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TXBOARD_DEPLOY_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Run unattended full installation
        env:
          TXBOARD_INSTALL_DIR: /tmp/txboard-deploy-smoke
          TXBOARD_ADMIN_EMAIL: smoke@example.com
          TXBOARD_MODE: http
          TXBOARD_PUBLIC_HOST: 127.0.0.1
          TXBOARD_HTTP_PORT: 18081
          TXBOARD_IMAGE_TAG: latest
          TXBOARD_BACKUP_RETENTION: 1
        run: cat install.sh | sudo -E bash -s -- --yes

      - name: Verify installed state
        run: |
          cd /tmp/txboard-deploy-smoke
          sudo docker compose exec -T txboard php artisan txboard:install-status --no-interaction
          curl -fsS http://127.0.0.1:18081/api/health | grep -q '"status":"ok"'
          sudo test -x /tmp/txboard-deploy-smoke/txboard.sh
          sudo test -x /tmp/txboard-deploy-smoke/update.sh
          sudo test -x /tmp/txboard-deploy-smoke/lib/common.sh
          sudo test -x /tmp/txboard-deploy-smoke/lib/backup.sh
          sudo test -x /tmp/txboard-deploy-smoke/lib/config.sh
          sudo /tmp/txboard-deploy-smoke/txboard.sh status >/dev/null
          sudo txboard status >/dev/null
          sudo txboard config-show >/dev/null
          sudo txboard backups >/dev/null
          sudo txboard help | grep -q 'Quick commands'
          sudo env -u TXBOARD_INSTALL_DIR /tmp/txboard-deploy-smoke/txboard.sh status >/dev/null
          sudo env -u TXBOARD_INSTALL_DIR /tmp/txboard-deploy-smoke/txboard.sh --dir /tmp/txboard-deploy-smoke status >/dev/null
          cat /tmp/txboard-deploy-smoke/update.sh | sudo -E bash -s -- --dir /tmp/txboard-deploy-smoke --yes --skip-backup
          sudo docker compose exec -T txboard php artisan txboard:install-status --no-interaction

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/txboard-deploy-smoke/compose.yaml ]; then
            cd /tmp/txboard-deploy-smoke
            sudo docker compose down -v --remove-orphans || true
          fi
          sudo rm -rf /tmp/txboard-deploy-smoke
