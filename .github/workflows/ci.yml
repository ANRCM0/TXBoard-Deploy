name: deploy-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n update.sh
          bash -n txboard.sh

      - name: Render deployment
        env:
          TXBOARD_INSTALL_DIR: /tmp/txboard-deploy-ci
          TXBOARD_ADMIN_EMAIL: ci@example.com
          TXBOARD_MODE: http
          TXBOARD_PUBLIC_HOST: 127.0.0.1
          TXBOARD_HTTP_PORT: 18080
          TXBOARD_IMAGE_TAG: latest
        run: |
          sudo -E bash install.sh --yes --render-only
          test -f /tmp/txboard-deploy-ci/compose.yaml
          test -f /tmp/txboard-deploy-ci/.env
          test -f /tmp/txboard-deploy-ci/api.env
          sudo docker compose -f /tmp/txboard-deploy-ci/compose.yaml \
            --env-file /tmp/txboard-deploy-ci/.env config >/dev/null

      - name: Require image-only Compose
        run: |
          ! sudo grep -Eq '^[[:space:]]*build:' /tmp/txboard-deploy-ci/compose.yaml
          sudo grep -q 'ghcr.io/paimoncai/txboard:latest' /tmp/txboard-deploy-ci/.env
          sudo grep -q '^TXBOARD_MODE=http$' /tmp/txboard-deploy-ci/.env
          test "$(sudo stat -c '%a' /tmp/txboard-deploy-ci/.env)" = "600"
          test "$(sudo stat -c '%a' /tmp/txboard-deploy-ci/api.env)" = "600"

      - name: Check public image manifest
        run: docker manifest inspect ghcr.io/paimoncai/txboard:latest >/dev/null

  smoke-install:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unattended full installation
        env:
          TXBOARD_INSTALL_DIR: /tmp/txboard-deploy-smoke
          TXBOARD_ADMIN_EMAIL: smoke@example.com
          TXBOARD_MODE: http
          TXBOARD_PUBLIC_HOST: 127.0.0.1
          TXBOARD_HTTP_PORT: 18081
          TXBOARD_IMAGE_TAG: latest
          TXBOARD_BACKUP_RETENTION: 1
          TXBOARD_DEPLOY_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}
        run: sudo -E bash install.sh --yes

      - name: Verify installed state
        run: |
          cd /tmp/txboard-deploy-smoke
          sudo docker compose exec -T txboard php artisan xboard:install-status --no-interaction
          curl -fsS http://127.0.0.1:18081/api/health | grep -q '"status":"ok"'
          sudo test -x /tmp/txboard-deploy-smoke/txboard.sh
          sudo test -x /tmp/txboard-deploy-smoke/update.sh
          sudo /tmp/txboard-deploy-smoke/txboard.sh status >/dev/null

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/txboard-deploy-smoke/compose.yaml ]; then
            cd /tmp/txboard-deploy-smoke
            sudo docker compose down -v --remove-orphans || true
          fi
          sudo rm -rf /tmp/txboard-deploy-smoke
