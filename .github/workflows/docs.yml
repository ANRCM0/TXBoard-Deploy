name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-docs.mjs'
      - 'scripts/tests/check-docs.test.mjs'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check-docs.mjs'
      - 'scripts/tests/check-docs.test.mjs'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test documentation validator fixtures
        run: node --test scripts/tests/check-docs.test.mjs
      - name: Discover first-party documentation
        id: docs
        run: |
          present=$(node scripts/check-docs.mjs --has-docs)
          [[ "$present" == true || "$present" == false ]]
          printf 'present=%s\n' "$present" >> "$GITHUB_OUTPUT"
      - name: Validate local documentation links
        if: steps.docs.outputs.present == 'true'
        run: node scripts/check-docs.mjs
      - name: Report documentation validation skip
        if: steps.docs.outputs.present == 'false'
        run: echo 'SKIP - no first-party Markdown documentation found; link validation did not run.'
