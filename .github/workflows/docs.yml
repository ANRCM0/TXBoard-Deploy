name: Documentation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/check-docs.mjs'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/check-docs.mjs'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local documentation links
        run: node scripts/check-docs.mjs
